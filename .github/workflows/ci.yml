name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "oxala-site/**"
      - "sanity/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "oxala-site/**"
      - "sanity/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-lint-build:
    name: Site lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oxala-site
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: oxala-site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Lint
        run: pnpm lint
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  sanity-build:
    name: Sanity build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sanity
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sanity/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
